name: Build qemu-system-arm

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            libglib2.0-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libgtk-3-dev \
            python3 \
            flex \
            bison

      - name: Configure QEMU
        run: |
          ./configure \
            --target-list=arm-softmmu \
            --enable-sdl \
            --enable-gtk \
            --disable-docs

      - name: Build qemu-system-arm
        run: |
          ninja -C build qemu-system-arm

      - name: Package Linux Binary
        run: |
          mkdir -p dist
          cp build/qemu-system-arm dist/
          tar -czvf qemu-system-arm-linux-x86_64.tar.gz -C dist qemu-system-arm

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-linux-x86_64
          path: qemu-system-arm-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-sdl2
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            python3
            bison
            flex

      - name: Configure QEMU
        shell: msys2 {0}
        run: |
          ./configure \
            --target-list=arm-softmmu \
            --enable-sdl \
            --enable-gtk \
            --disable-docs

      - name: Build qemu-system-arm
        shell: msys2 {0}
        run: |
          ninja -C build qemu-system-arm

      - name: Package Windows Binary and DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/qemu-system-arm.exe dist/
          if [ -f build/qemu-system-armw.exe ]; then
            cp build/qemu-system-armw.exe dist/
          fi

          # Bundle required MinGW DLL dependencies for standalone execution
          cd dist
          for binary in *.exe; do
            for dll in $(ldd "$binary" | grep '/mingw64/bin/' | awk '{print $3}'); do
              if [ -f "$dll" ]; then
                cp -u "$dll" .
              fi
            done
          done
          cd ..

          zip -r qemu-system-arm-windows-x86_64.zip dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-windows-x86_64
          path: qemu-system-arm-windows-x86_64.zip
