name: Build qemu-system-arm

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: 2G
  # Shared across Linux/Windows; object files themselves are not reused,
  # but wrap downloads and matching compiler hashes can hit.
  CACHE_KEY_PREFIX: qemu-common

jobs:
  build-linux:
    name: Build Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore common cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            subprojects/packagecache
          key: qemu-common-${{ hashFiles('meson.build', 'configure', 'subprojects/*.wrap') }}
          restore-keys: |
            qemu-common-
          enableCrossOsArchive: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            pkg-config \
            ccache \
            libglib2.0-dev \
            libpixman-1-dev \
            libsdl2-dev \
            libsdl2-image-dev \
            libgtk-3-dev \
            libvte-2.91-dev \
            libslirp-dev \
            libgnutls28-dev \
            libcurl4-gnutls-dev \
            libusb-1.0-0-dev \
            libusbredirhost-dev \
            libcapstone-dev \
            libzstd-dev \
            libjpeg-dev \
            libpng-dev \
            liblzo2-dev \
            libsnappy-dev \
            libbz2-dev \
            python3 \
            python3-venv \
            flex \
            bison \
            diffutils

      - name: Configure QEMU
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ./configure \
            --target-list=arm-softmmu \
            --enable-sdl \
            --enable-sdl-image \
            --enable-gtk \
            --enable-vte \
            --enable-slirp \
            --enable-vnc \
            --enable-vnc-jpeg \
            --enable-curl \
            --enable-gnutls \
            --enable-libusb \
            --enable-usb-redir \
            --enable-capstone \
            --enable-zstd \
            --enable-lzo \
            --enable-snappy \
            --disable-docs

      - name: Build qemu-system-arm
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          ninja -C build qemu-system-arm
          ccache -s || true

      - name: Package Linux Binary
        run: |
          mkdir -p dist
          cp build/qemu-system-arm dist/
          tar -czvf qemu-system-arm-linux-x86_64.tar.gz -C dist qemu-system-arm

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-linux-x86_64
          path: qemu-system-arm-linux-x86_64.tar.gz

  build-windows:
    name: Build Windows (x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore common cache
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            subprojects/packagecache
          key: qemu-common-${{ hashFiles('meson.build', 'configure', 'subprojects/*.wrap') }}
          restore-keys: |
            qemu-common-
          enableCrossOsArchive: true

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            zip
            diffutils
            bison
            flex
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-meson
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-gtk3
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-gnutls
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-usbredir
            mingw-w64-x86_64-capstone
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-libjpeg-turbo
            mingw-w64-x86_64-libpng
            mingw-w64-x86_64-lzo2
            mingw-w64-x86_64-snappy
            mingw-w64-x86_64-python

      - name: Configure QEMU
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/lib/ccache/bin:/mingw64/bin:$PATH"
          ./configure \
            --target-list=arm-softmmu \
            --enable-sdl \
            --enable-sdl-image \
            --enable-gtk \
            --enable-slirp \
            --enable-vnc \
            --enable-vnc-jpeg \
            --enable-curl \
            --enable-gnutls \
            --enable-libusb \
            --enable-usb-redir \
            --enable-capstone \
            --enable-zstd \
            --enable-lzo \
            --enable-snappy \
            --disable-docs

      - name: Build qemu-system-arm
        shell: msys2 {0}
        run: |
          export PATH="/mingw64/lib/ccache/bin:/mingw64/bin:$PATH"
          ninja -C build qemu-system-arm.exe
          ccache -s || true

      - name: Package Windows Binary and DLLs
        shell: msys2 {0}
        run: |
          mkdir -p dist
          cp build/qemu-system-arm.exe dist/
          if [ -f build/qemu-system-armw.exe ]; then
            cp build/qemu-system-armw.exe dist/
          fi

          # Bundle required MinGW DLL dependencies for standalone execution
          cd dist
          for binary in *.exe; do
            for dll in $(ldd "$binary" | grep '/mingw64/bin/' | awk '{print $3}'); do
              if [ -f "$dll" ]; then
                cp -u "$dll" .
              fi
            done
          done
          cd ..

          zip -r qemu-system-arm-windows-x86_64.zip dist

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: qemu-system-arm-windows-x86_64
          path: qemu-system-arm-windows-x86_64.zip
